name: OpenVAS Course Lab - Controlled Local Target

on:
  push:
    branches:
      - ethical-hacking-midterm-lab
    paths:
      - 'ethical-hacking-lab/openvas_http_check.nasl'
      - '.github/workflows/openvas-course-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  openvas-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OpenVAS scanner engine and screenshot tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            openvas-scanner redis-server redis-tools xvfb xterm scrot fonts-dejavu-core
          openvas-nasl -V | tee openvas_version.txt

      - name: Start OpenVAS Redis backend
        run: |
          set -e
          sudo mkdir -p /var/run/redis-openvas
          sudo chown redis:redis /var/run/redis-openvas
          if [ -f /etc/redis/redis-openvas.conf ]; then
            sudo redis-server /etc/redis/redis-openvas.conf --daemonize yes
          else
            sudo redis-server --daemonize yes \
              --port 0 \
              --unixsocket /var/run/redis-openvas/redis-server.sock \
              --unixsocketperm 770
          fi
          sleep 2
          test -S /var/run/redis-openvas/redis-server.sock
          sudo redis-cli -s /var/run/redis-openvas/redis-server.sock ping | grep -q PONG

      - name: Start controlled localhost web target
        run: |
          python3 ethical-hacking-lab/http_target.py > http_target.log 2>&1 &
          echo $! > /tmp/http_target.pid
          sleep 2
          ss -lnt | grep '127.0.0.1:8080'

      - name: Validate NASL syntax
        run: |
          set -e
          SCRIPT="$GITHUB_WORKSPACE/ethical-hacking-lab/openvas_http_check.nasl"
          test -f "$SCRIPT"
          ls -l "$SCRIPT"
          sudo openvas-nasl -L -X "$SCRIPT"

      - name: Execute OpenVAS NASL assessment
        run: |
          SCRIPT="$GITHUB_WORKSPACE/ethical-hacking-lab/openvas_http_check.nasl"
          {
            echo '$ sudo openvas-nasl -X -t 127.0.0.1 openvas_http_check.nasl'
            sudo openvas-nasl -X -t 127.0.0.1 "$SCRIPT"
          } 2>&1 | tee 06_vulnerability_openvas.txt

      - name: Capture real terminal evidence
        run: |
          chmod +x ethical-hacking-lab/capture_terminal.sh
          ethical-hacking-lab/capture_terminal.sh \
            "$PWD/06_vulnerability_openvas.txt" \
            "$PWD/06_vulnerability_openvas.png" \
            "06_vulnerability_openvas"
          test -s 06_vulnerability_openvas.png

      - name: Upload OpenVAS evidence
        uses: actions/upload-artifact@v4
        with:
          name: openvas-course-evidence
          path: |
            openvas_version.txt
            06_vulnerability_openvas.txt
            06_vulnerability_openvas.png
          if-no-files-found: error
          retention-days: 14
