name: Ethical Hacking Midterm - Controlled Lab

on:
  push:
    branches:
      - ethical-hacking-midterm-lab
    paths-ignore:
      - 'ethical-hacking-lab/evidence/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  practical-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout lab branch
        uses: actions/checkout@v4

      - name: Prepare evidence folders
        run: |
          rm -rf evidence
          mkdir -p evidence/raw evidence/display evidence/screenshots evidence/meta
          {
            echo "Ethical Hacking Midterm - Controlled Local Lab"
            echo "Date (UTC): $(date -u '+%Y-%m-%d %H:%M:%S')"
            echo "Runner: $(uname -a)"
            echo "Scope: active scanning restricted to localhost; footprinting uses passive public sources only"
          } | tee evidence/meta/environment.txt

      - name: Install course tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            nmap hping3 nikto samba smbclient snmp snmpd \
            xvfb xterm scrot fonts-dejavu-core \
            python3-pip python3-venv git curl jq
          {
            echo "=== Installed tool versions ==="
            nmap --version | head -n 2
            hping3 --version 2>&1 | head -n 2 || true
            nikto -Version 2>&1 | head -n 4 || true
            smbclient --version
            snmpwalk --version 2>&1 | head -n 3
          } | tee evidence/meta/tool_versions.txt

      - name: Install passive footprinting tools
        run: |
          set -e
          git clone --depth 1 https://github.com/aboul3la/Sublist3r.git /tmp/Sublist3r
          python3 -m venv /tmp/sublist3r-venv
          source /tmp/sublist3r-venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r /tmp/Sublist3r/requirements.txt
          deactivate

          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          git clone --depth 1 https://github.com/laramies/theHarvester.git /tmp/theHarvester
          cd /tmp/theHarvester
          uv sync --python 3.14
          cd "$GITHUB_WORKSPACE"

      - name: Build localhost-only target services
        run: |
          set -e
          python3 ethical-hacking-lab/http_target.py > evidence/raw/http_target_service.log 2>&1 &
          echo $! > /tmp/http_target.pid

          # Stop distro Samba first so only the controlled configuration owns TCP/445.
          sudo systemctl stop smbd nmbd samba-ad-dc 2>/dev/null || true
          sudo pkill -x smbd 2>/dev/null || true
          sudo pkill -x nmbd 2>/dev/null || true
          sudo mkdir -p /tmp/cyberlab-share
          echo "Authorized coursework share - synthetic data only" | sudo tee /tmp/cyberlab-share/README.txt >/dev/null
          sudo chmod 755 /tmp/cyberlab-share
          cat > /tmp/smb-lab.conf <<'EOF'
          [global]
            workgroup = WORKGROUP
            server string = CEH Controlled SMB Lab
            server role = standalone server
            security = user
            map to guest = Bad User
            guest account = nobody
            interfaces = 127.0.0.1/8
            bind interfaces only = yes
            smb ports = 445
            disable netbios = yes
            load printers = no
            disable spoolss = yes
            printcap name = /dev/null
            log file = /tmp/smb-lab.log
            logging = file

          [public]
            path = /tmp/cyberlab-share
            browseable = yes
            guest ok = yes
            read only = yes
          EOF
          sudo smbd -D -s /tmp/smb-lab.conf

          sudo systemctl stop snmpd 2>/dev/null || true
          sudo pkill -x snmpd 2>/dev/null || true
          cat > /tmp/snmpd-lab.conf <<'EOF'
          agentAddress udp:127.0.0.1:161
          rocommunity public 127.0.0.1
          sysLocation Controlled Ethical Hacking Lab
          sysContact coursework@cyberlab.local
          sysName CEH-Lab-Target
          EOF
          sudo /usr/sbin/snmpd -f -Lo -C -c /tmp/snmpd-lab.conf > evidence/raw/snmpd_service.log 2>&1 &
          echo $! > /tmp/snmpd.pid

          sleep 3
          {
            echo "=== Local lab listeners ==="
            sudo ss -lntup | grep -E '(:8080|:2222|:445|:161)' || true
            echo
            echo "=== HTTP check ==="
            curl -sS -I http://127.0.0.1:8080/
            echo
            echo "=== SMB check ==="
            smbclient -L //127.0.0.1 -N -p 445
            echo
            echo "=== SNMP check ==="
            snmpwalk -v2c -c public 127.0.0.1 1.3.6.1.2.1.1.5.0
          } | tee evidence/meta/lab_verification.txt

          # Hard fail if the intended local SMB share is not visible.
          smbclient -L //127.0.0.1 -N -p 445 | grep -q 'public'
          # Hard fail if Samba escaped localhost binding.
          if sudo ss -lntp '( sport = :445 )' | grep -E '0\.0\.0\.0:445|\[::\]:445'; then
            echo 'ERROR: SMB listener is not loopback-only.' >&2
            exit 1
          fi

      - name: Footprinting - theHarvester
        continue-on-error: true
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          {
            echo '$ uv run theHarvester -d nmap.org -b crtsh,certspotter --limit 30'
            echo '# Passive P0 sources only; no active probing.'
            cd /tmp/theHarvester
            timeout 300 uv run theHarvester -d nmap.org -b crtsh,certspotter --limit 30
          } 2>&1 | tee "$GITHUB_WORKSPACE/evidence/raw/01_footprinting_theharvester.txt"

      - name: Footprinting - Sublist3r
        continue-on-error: true
        run: |
          source /tmp/sublist3r-venv/bin/activate
          {
            echo '$ python3 sublist3r.py -d nmap.org -t 10'
            echo '# Passive public-source subdomain enumeration.'
            timeout 300 python3 /tmp/Sublist3r/sublist3r.py -d nmap.org -t 10
          } 2>&1 | tee evidence/raw/02_footprinting_sublist3r.txt
          deactivate

      - name: Network Scanning - Nmap
        run: |
          {
            echo '$ sudo nmap -sS -sV -p 445,8080,2222 127.0.0.1'
            sudo nmap -sS -sV -p 445,8080,2222 127.0.0.1
          } 2>&1 | tee evidence/raw/03_scanning_nmap.txt

      - name: Network Scanning - Hping3
        run: |
          {
            echo '$ sudo hping3 -S -p 8080 -c 3 127.0.0.1'
            sudo hping3 -S -p 8080 -c 3 127.0.0.1
          } 2>&1 | tee evidence/raw/04_scanning_hping3.txt

      - name: Vulnerability Scanning - Nikto
        continue-on-error: true
        run: |
          {
            echo '$ timeout 120 nikto -h http://127.0.0.1:8080 -ask no'
            timeout 120 nikto -h http://127.0.0.1:8080 -ask no
          } 2>&1 | tee evidence/raw/05_vulnerability_nikto.txt

      - name: Vulnerability Scanning - Nmap NSE
        run: |
          {
            echo '$ sudo nmap -sV -p 8080 --script http-methods,http-headers 127.0.0.1'
            sudo nmap -sV -p 8080 --script http-methods,http-headers 127.0.0.1
          } 2>&1 | tee evidence/raw/06_vulnerability_nmap_nse.txt

      - name: Enumeration - smbclient
        run: |
          {
            echo '$ smbclient -L //127.0.0.1 -N -p 445'
            smbclient -L //127.0.0.1 -N -p 445
          } 2>&1 | tee evidence/raw/07_enumeration_smbclient.txt

      - name: Enumeration - SnmpWalk
        run: |
          {
            echo '$ snmpwalk -v2c -c public 127.0.0.1 1.3.6.1.2.1.1'
            snmpwalk -v2c -c public 127.0.0.1 1.3.6.1.2.1.1
          } 2>&1 | tee evidence/raw/08_enumeration_snmpwalk.txt

      - name: Prepare concise terminal evidence
        if: always()
        run: |
          set +e
          strip_ansi() { sed -r 's/\x1B\[[0-9;?]*[ -\/]*[@-~]//g'; }

          {
            sed -n '1,2p' evidence/raw/01_footprinting_theharvester.txt
            strip_ansi < evidence/raw/01_footprinting_theharvester.txt | grep -E '^\[\*\] (Activity|Target|Hosts found)|^issues\.nmap\.org$|^svn\.nmap\.org$|^www\.nmap\.org$' || true
          } > evidence/display/01_footprinting_theharvester.txt

          {
            sed -n '1,2p' evidence/raw/02_footprinting_sublist3r.txt
            strip_ansi < evidence/raw/02_footprinting_sublist3r.txt | grep -E 'Enumerating subdomains|Total Unique Subdomains Found|^[A-Za-z0-9.-]+\.nmap\.org$' || true
          } > evidence/display/02_footprinting_sublist3r.txt

          cp evidence/raw/03_scanning_nmap.txt evidence/display/03_scanning_nmap.txt
          cp evidence/raw/04_scanning_hping3.txt evidence/display/04_scanning_hping3.txt

          {
            grep -E '^\$|^- Nikto|Target IP:|Target Hostname:|Target Port:|Server:|x-powered-by|X-Frame-Options|robots\.txt|appears to be outdated|Allowed HTTP Methods|OSVDB-3092|items checked|host\(s\) tested' evidence/raw/05_vulnerability_nikto.txt || true
          } > evidence/display/05_vulnerability_nikto.txt

          cp evidence/raw/06_vulnerability_nmap_nse.txt evidence/display/06_vulnerability_nmap_nse.txt
          cp evidence/raw/07_enumeration_smbclient.txt evidence/display/07_enumeration_smbclient.txt
          sed -n '1,16p' evidence/raw/08_enumeration_snmpwalk.txt > evidence/display/08_enumeration_snmpwalk.txt

          for f in evidence/display/0*.txt; do
            tmp="$f.tmp"
            strip_ansi < "$f" > "$tmp"
            mv "$tmp" "$f"
          done

      - name: Capture terminal screenshots
        if: always()
        run: |
          set -e
          chmod +x ethical-hacking-lab/capture_terminal.sh
          for f in evidence/display/0*.txt; do
            base="$(basename "$f" .txt)"
            echo "Capturing $base"
            ethical-hacking-lab/capture_terminal.sh "$PWD/$f" "$PWD/evidence/screenshots/${base}.png" "$base"
          done
          echo '=== Screenshot files ==='
          ls -lh evidence/screenshots
          test "$(find evidence/screenshots -type f -name '*.png' | wc -l)" -eq 8

      - name: Build execution summary
        if: always()
        run: |
          {
            echo '# Ethical Hacking Midterm - Verified Execution Evidence'
            echo
            echo 'Active scans were restricted to 127.0.0.1 on an ephemeral GitHub-hosted Ubuntu runner. Footprinting used passive public sources only.'
            echo
            echo '## Required topics and executed tools'
            echo '- Footprinting: theHarvester, Sublist3r'
            echo '- Network Scanning: Nmap, Hping3'
            echo '- Vulnerability Scanning: Nikto, Nmap NSE HTTP assessment scripts'
            echo '- Enumeration: smbclient, SnmpWalk'
            echo
            echo '## Course-alignment note'
            echo 'The course Vulnerability Analysis slides explicitly present OpenVAS and Nikto. OpenVAS was not used in this ephemeral runner because a complete Greenbone/OpenVAS scanner requires vulnerability feeds and substantially more persistent resources. Nmap NSE was used as the second practical vulnerability-assessment tool; Nmap is taught in the course scanning module. This substitution must be stated rather than presented as OpenVAS execution.'
            echo
            echo '## Evidence integrity'
            echo 'Raw command output is preserved under raw/. Screenshot images are captures of concise selections from those same outputs; no results were invented.'
          } > evidence/EXECUTION_SUMMARY.md

      - name: Upload lab evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ethical-hacking-midterm-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 14

      - name: Commit verified evidence to isolated branch
        if: success()
        run: |
          rm -rf ethical-hacking-lab/evidence
          mkdir -p ethical-hacking-lab/evidence
          cp -a evidence/. ethical-hacking-lab/evidence/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ethical-hacking-lab/evidence
          git commit -m 'Store verified coursework evidence [skip ci]' || exit 0
          git push origin HEAD:ethical-hacking-midterm-lab
